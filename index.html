<body>

<!-- LOGIN -->
<div class="login-page" id="loginPage">

<div class="login-box">

<div class="logo-icon">W</div>

<h1>WMN3 DNS PRO</h1>

<p>Enter your credentials to access the dashboard</p>

<label>Username</label>
<input type="text" id="username" placeholder="Enter username">

<label>Password</label>
<input type="password" id="password" placeholder="Enter password">

<button class="login-btn" onclick="login()">Sign In</button>

<div class="error" id="error">Invalid Username or Password</div>

<div class="footer">
© 2026 WMN3 DNS Professional Suite
</div>

</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">

<div class="topbar">
<div class="brand">WMN3 DNS PRO</div>

<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
<div class="user" id="userText"></div>
<button class="logout" onclick="logout()">Logout</button>
</div>
</div>

<div class="wrapper">

<div class="grid">

<div class="card">
<h2>SPF Records</h2>

<label>Domains</label>
<textarea id="spfDomains"></textarea>

<label>IPs</label>
<textarea id="spfIps"></textarea>

<button class="action" onclick="generateSPF()">Generate SPF</button>
</div>

<div class="card">
<h2>MX Records</h2>

<label>Domains</label>
<textarea id="mxDomains"></textarea>

<label>IPs</label>
<textarea id="mxIps"></textarea>

<button class="action" onclick="generateMX()">Generate MX</button>
</div>

<div class="card">
<h2>A Records</h2>

<label>Domains</label>
<textarea id="aDomains"></textarea>

<label>IPs</label>
<textarea id="aIps"></textarea>

<button class="action" onclick="generateA()">Generate A</button>
</div>

</div>

<div class="panel">

<h2>Output Console</h2>

<textarea id="output" readonly></textarea>

<div class="row">
<button class="copy" onclick="copyOutput()">Copy</button>
<button class="clear" onclick="clearAll()">Clear</button>
</div>

</div>

<div class="panel">

<h2>My History</h2>

<div id="historyList"></div>

</div>

</div>
</div>

<script>
const USERS = [
{user:"admin",pass:"123456"},
{user:"user1",pass:"111111"},
{user:"user2",pass:"222222"}
];

let currentUser="";

function login(){

let u=username.value.trim();
let p=password.value.trim();

let found=USERS.find(x=>x.user===u && x.pass===p);

if(found){

currentUser=found.user;

loginPage.style.display="none";
dashboard.style.display="block";

userText.innerHTML="👤 "+found.user;

renderHistory();

}else{
error.style.display="block";
}

}

function logout(){
location.reload();
}

document.addEventListener("keydown",function(e){
if(e.key==="Enter"){
login();
}
});

function lines(id){
return document.getElementById(id).value
.split('\n')
.map(x=>x.trim())
.filter(x=>x);
}

function setOutput(text){
output.value=text.trim();
saveHistory(text.trim());
}

function saveHistory(result){

if(!result)return;

let key="history_"+currentUser;

let h=JSON.parse(localStorage.getItem(key)||"[]");

h.unshift({
date:new Date().toLocaleString(),
data:result
});

h=h.slice(0,25);

localStorage.setItem(key,JSON.stringify(h));

renderHistory();
}

function renderHistory(){

let key="history_"+currentUser;

let h=JSON.parse(localStorage.getItem(key)||"[]");

historyList.innerHTML="";

h.forEach(item=>{

let div=document.createElement("div");

div.className="history-item";

div.innerHTML="<b>"+item.date+"</b>";

div.onclick=function(){
output.value=item.data;
};

historyList.appendChild(div);

});
}

function generateSPF(){

let d=lines("spfDomains");
let i=lines("spfIps");

let txt=i.map(ip=>"ip4:"+ip).join(" ");

let out="";

d.forEach(domain=>{
out+=domain+","+domain+',TXT,"v=spf1 '+txt+' -all"\n';
});

setOutput(out);
}

function generateMX(){

let d=lines("mxDomains");
let i=lines("mxIps").join(";");

let out="";

d.forEach(domain=>{
out+=domain+","+domain+",TXT,MXrecords:"+i+"\n";
});

setOutput(out);
}

function generateA(){

let d=lines("aDomains");
let i=lines("aIps").join(";");

let out="";

d.forEach(domain=>{
out+=domain+","+domain+",TXT,Arecords:"+i+"\n";
});

setOutput(out);
}

function copyOutput(){
output.select();
document.execCommand("copy");
}

function clearAll(){
document.querySelectorAll("textarea").forEach(t=>t.value="");
}
</script>

</body>
</html>
