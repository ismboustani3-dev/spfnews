<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif;}

--bg:#0f172a;

<body>

<!-- LOGIN -->
<div class="login-page" id="loginPage">
<div class="login-box">

<h1 style="text-align:center;">🔒 Multi User Access</h1>
<p style="text-align:center;color:#94a3b8;margin-top:8px;">Login to continue</p>

<label>Username</label>
<input type="text" id="username">

<label>Password</label>
<input type="password" id="password">

<button class="login-btn" onclick="login()">Login</button>

<div class="error" id="error">Invalid Username or Password</div>

</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">

<div class="topbar">

<div class="brand">
<div class="wmn3-logo">
<span>W</span>
<span>M</span>
<span>N</span>
<span>3</span>
</div>

<div class="brand-text">
<h1>WMN3 DNS PRO</h1>
<p>Multi Users Edition</p>
</div>
</div>

<div>
<span class="userinfo" id="userInfo"></span>
<button class="logout" onclick="logout()">Logout</button>
</div>

</div>

<div class="wrapper">

<div class="grid">

<div class="card">
<h2>SPF Records</h2>
<label>Domains</label>
<textarea id="spfDomains"></textarea>
<label>Subdomains</label>
<textarea id="spfSubs"></textarea>
<label>IPs</label>
<textarea id="spfIps"></textarea>
<button class="action" onclick="generateSPF()">Generate SPF</button>
</div>

<div class="card">
<h2>MX Records</h2>
<label>Domains</label>
<textarea id="mxDomains"></textarea>
<label>Subdomains</label>
<textarea id="mxSubs"></textarea>
<label>IPs</label>
<textarea id="mxIps"></textarea>
<button class="action" onclick="generateMX()">Generate MX</button>
</div>

<div class="card">
<h2>A Records</h2>
<label>Domains</label>
<textarea id="aDomains"></textarea>
<label>Subdomains</label>
<textarea id="aSubs"></textarea>
<label>IPs</label>
<textarea id="aIps"></textarea>
<button class="action" onclick="generateA()">Generate A</button>
</div>

</div>

<div class="output">
<h2 style="margin-bottom:14px;">Output Console</h2>
<textarea id="output" readonly></textarea>

<div class="row">
<button class="copy" onclick="copyOutput()">Copy</button>
<button class="clear" onclick="clearAll()">Clear</button>
</div>
</div>

<div class="history">
<h2>History</h2>
<ul id="historyList"></ul>
</div>

</div>
</div>

<script>
const USERS = [
{user:"admin",pass:"123456",role:"admin"},
{user:"user1",pass:"111111",role:"member"},
{user:"user2",pass:"222222",role:"member"},
{user:"client",pass:"333333",role:"member"}
];

let currentUser="";

function login(){

let u=username.value.trim();
let p=password.value.trim();

let found = USERS.find(x => x.user===u && x.pass===p);

if(found){

currentUser = found.user;

loginPage.style.display="none";
dashboard.style.display="block";

userInfo.innerHTML="👤 "+found.user+" ("+found.role+")";

renderHistory();

}else{
error.style.display="block";
}

}

function logout(){
location.reload();
}

document.addEventListener("keydown",e=>{
if(e.key==="Enter" && loginPage.style.display!=="none"){
login();
}
});

function lines(id){
return document.getElementById(id).value
.split('\n')
.map(x=>x.trim())
.filter(x=>x);
}

function setOutput(text){
output.value=text.trim();
saveHistory(text.trim());
}

function saveHistory(result){

if(!result)return;

let key="history_"+currentUser;

let h=JSON.parse(localStorage.getItem(key)||"[]");

h.unshift({
user:currentUser,
date:new Date().toLocaleString(),
data:result
});

h=h.slice(0,30);

localStorage.setItem(key,JSON.stringify(h));

renderHistory();
}

function renderHistory(){

historyList.innerHTML="";

let key="history_"+currentUser;

let h=JSON.parse(localStorage.getItem(key)||"[]");

h.forEach(item=>{

let li=document.createElement("li");

li.innerHTML=
"<b>"+item.user+"</b><br><small>"+item.date+"</small>";

li.onclick=()=>{
output.value=item.data;
};

historyList.appendChild(li);

});

}

function generateSPF(){

let d=lines("spfDomains"),
s=lines("spfSubs"),
i=lines("spfIps");

let txt=i.map(ip=>"ip4:"+ip).join(" ");

let out="";

d.forEach(domain=>{
if(s.length){
s.forEach(sub=>{
out+=domain+","+sub+',TXT,"v=spf1 '+txt+' -all"\n';
});
}else{
out+=domain+","+domain+',TXT,"v=spf1 '+txt+' -all"\n';
}
});

setOutput(out);
}

function generateMX(){

let d=lines("mxDomains"),
s=lines("mxSubs"),
i=lines("mxIps").join(";");

let out="";

d.forEach(domain=>{
if(s.length){
s.forEach(sub=>{
out+=domain+","+sub+",TXT,MXrecords:"+i+"\n";
});
}else{
out+=domain+","+domain+",TXT,MXrecords:"+i+"\n";
}
});

setOutput(out);
}

function generateA(){

let d=lines("aDomains"),
s=lines("aSubs"),
i=lines("aIps").join(";");

let out="";

d.forEach(domain=>{
if(s.length){
s.forEach(sub=>{
out+=domain+","+sub+",TXT,Arecords:"+i+"\n";
});
}else{
out+=domain+","+domain+",TXT,Arecords:"+i+"\n";
}
});

setOutput(out);
}

function copyOutput(){
output.select();
document.execCommand("copy");
}

function clearAll(){
document.querySelectorAll("textarea").forEach(t=>t.value="");
}
</script>

</body>
</html>
