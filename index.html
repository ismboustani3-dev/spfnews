<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WMN3 DNS PRO - Dark Version</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:#fff;
min-height:100vh;
}

/* LOGIN */
.login-page{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
background:linear-gradient(135deg,#020617,#0f172a,#111827);
}

.login-box{
width:100%;
max-width:460px;
background:#111827;
padding:42px 36px;
border-radius:28px;
box-shadow:0 25px 70px rgba(0,0,0,.35);
text-align:center;
animation:fadeUp .7s ease;
border:1px solid #1f2937;
}

.logo{
width:82px;
height:82px;
margin:auto;
border-radius:24px;
background:linear-gradient(135deg,#2563eb,#10b981);
display:flex;
align-items:center;
justify-content:center;
font-size:38px;
color:#fff;
margin-bottom:18px;
font-weight:900;
}

.login-box h1{
font-size:42px;
font-weight:900;
margin-bottom:10px;
color:#fff;
}

.login-box p{
font-size:17px;
color:#94a3b8;
line-height:1.6;
margin-bottom:28px;
}

.field{
text-align:left;
margin-bottom:18px;
}

.field label{
display:block;
font-weight:800;
margin-bottom:8px;
font-size:14px;
color:#e5e7eb;
}

.field input{
width:100%;
padding:16px;
border-radius:16px;
border:1px solid #334155;
outline:none;
font-size:16px;
background:#020617;
color:#fff;
}

.field input:focus{
border-color:#2563eb;
}

.login-btn{
width:100%;
padding:16px;
border:none;
border-radius:16px;
font-size:24px;
font-weight:900;
color:#fff;
cursor:pointer;
background:linear-gradient(90deg,#3b82f6,#10b981);
margin-top:8px;
}

.error{
display:none;
margin-top:14px;
font-weight:800;
color:#ef4444;
}

.footer-login{
margin-top:26px;
font-size:14px;
color:#64748b;
}

/* DASHBOARD */
#dashboard{
display:none;
}

.topbar{
background:#111827;
padding:18px 25px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
border-bottom:1px solid #1f2937;
}

.logout{
border:none;
padding:12px 18px;
border-radius:12px;
background:#ef4444;
color:#fff;
font-weight:700;
cursor:pointer;
}

.wrapper{
max-width:1500px;
margin:auto;
padding:25px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
}

.card,.panel{
background:#111827;
padding:22px;
border-radius:18px;
border:1px solid #1f2937;
}

.card h3,.panel h3{
margin-bottom:15px;
}

textarea,input,select{
width:100%;
padding:12px;
border-radius:12px;
border:1px solid #334155;
outline:none;
margin-top:10px;
background:#020617;
color:#fff;
}

textarea{
height:100px;
resize:vertical;
}

button{
border:none;
padding:12px;
border-radius:12px;
cursor:pointer;
font-weight:700;
color:#fff;
margin-top:12px;
}

.blue{background:#2563eb;}
.red{background:#ef4444;}
.green{background:#10b981;}
.gold{background:#d97706;}

.panel{
margin-top:25px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
padding:10px;
border-bottom:1px solid #1f2937;
text-align:left;
font-size:14px;
vertical-align:top;
}

.status-on{color:#10b981;font-weight:bold;}
.status-off{color:#ef4444;font-weight:bold;}

.history-item{
padding:10px;
border-bottom:1px solid #1f2937;
cursor:pointer;
border-radius:10px;
}

.history-item:hover{
background:#1e293b;
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(25px);}
to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-page" id="loginPage">
<div class="login-box">

<div class="logo">W</div>

<h1>WMN3 DNS PRO</h1>

<p>Secure access to your professional dashboard</p>

<div class="field">
<label>Username</label>
<input type="text" id="username" placeholder="Enter username">
</div>

<div class="field">
<label>Password</label>
<input type="password" id="password" placeholder="Enter password">
</div>

<button class="login-btn" onclick="login()">Sign In</button>

<div class="error" id="error">Invalid Username or Password</div>

<div class="footer-login">Powered by WMN3 Security Suite</div>

</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">

<div class="topbar">
<div>
<h2>WMN3 DNS PRO</h2>
<div id="welcome"></div>
</div>

<button class="logout" onclick="logout()">Logout</button>
</div>

<div class="wrapper">

<div class="grid">

<div class="card">
<h3>SPF Generator</h3>
<textarea id="spfDomains" placeholder="Domains"></textarea>
<textarea id="spfIps" placeholder="IPs"></textarea>
<button class="blue" onclick="generateSPF()">Generate</button>
</div>

<div class="card">
<h3>MX Generator</h3>
<textarea id="mxDomains" placeholder="Domains"></textarea>
<textarea id="mxIps" placeholder="IPs"></textarea>
<button class="blue" onclick="generateMX()">Generate</button>
</div>

<div class="card">
<h3>A Generator</h3>
<textarea id="aDomains" placeholder="Domains"></textarea>
<textarea id="aIps" placeholder="IPs"></textarea>
<button class="blue" onclick="generateA()">Generate</button>
</div>

</div>

<div class="panel">
<h3>Output</h3>
<textarea id="output" style="height:220px"></textarea>
<button class="green" onclick="copyOutput()">Copy</button>
</div>

<div class="panel">
<h3>My History</h3>
<div id="historyList"></div>
</div>

<div class="panel" id="adminPanel" style="display:none">
<h2 style="color:#f59e0b;">👑 Admin Panel</h2>
<p style="margin-top:10px;color:#94a3b8;">Users management version included.</p>
</div>

</div>
</div>

<script>
let USERS = JSON.parse(localStorage.getItem("usersDB")) || [
{user:"admin",pass:"123456",role:"admin",online:false,lastSeen:"-"},
{user:"user1",pass:"111111",role:"member",online:false,lastSeen:"-"},
{user:"user2",pass:"222222",role:"member",online:false,lastSeen:"-"}
];

let currentUser=null;

function saveUsers(){
localStorage.setItem("usersDB",JSON.stringify(USERS));
}

function login(){
let u=username.value.trim();
let p=password.value.trim();

let found=USERS.find(x=>x.user===u && x.pass===p);

if(found){
currentUser=found;
found.online=true;
found.lastSeen=new Date().toLocaleString();
saveUsers();

loginPage.style.display="none";
dashboard.style.display="block";

welcome.innerHTML="👤 "+found.user+" ("+found.role+")";

renderHistory();

if(found.role==="admin"){
adminPanel.style.display="block";
}
}else{
error.style.display="block";
}
}

function logout(){
if(currentUser){
let f=USERS.find(x=>x.user===currentUser.user);
if(f){
f.online=false;
f.lastSeen=new Date().toLocaleString();
saveUsers();
}
}
location.reload();
}

function lines(id){
return document.getElementById(id).value.split('\n').map(x=>x.trim()).filter(x=>x);
}

function setOutput(text){
output.value=text.trim();
saveHistory(text.trim());
}

function saveHistory(result){
let key="history_"+currentUser.user;
let h=JSON.parse(localStorage.getItem(key)||"[]");

h.unshift({
date:new Date().toLocaleString(),
data:result
});

h=h.slice(0,30);

localStorage.setItem(key,JSON.stringify(h));
renderHistory();
}

function renderHistory(){
let key="history_"+currentUser.user;
let h=JSON.parse(localStorage.getItem(key)||"[]");

historyList.innerHTML="";

h.forEach(item=>{
let div=document.createElement("div");
div.className="history-item";
div.innerHTML=item.date;

div.onclick=()=>{
output.value=item.data;
};

historyList.appendChild(div);
});
}

function generateSPF(){
let d=lines("spfDomains");
let i=lines("spfIps");
let txt=i.map(ip=>"ip4:"+ip).join(" ");
let out="";

d.forEach(domain=>{
out+=domain+","+domain+',TXT,"v=spf1 '+txt+' -all"\n';
});

setOutput(out);
}

function generateMX(){
let d=lines("mxDomains");
let i=lines("mxIps").join(";");
let out="";

d.forEach(domain=>{
out+=domain+","+domain+",TXT,MXrecords:"+i+"\n";
});

setOutput(out);
}

function generateA(){
let d=lines("aDomains");
let i=lines("aIps").join(";");
let out="";

d.forEach(domain=>{
out+=domain+","+domain+",TXT,Arecords:"+i+"\n";
});

setOutput(out);
}

function copyOutput(){
output.select();
document.execCommand("copy");
}
</script>

</body>
</html>
