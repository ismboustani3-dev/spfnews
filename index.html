```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WMN3 DNS PRO - ADMIN HISTORY</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
background:#0f172a;
color:#fff;
min-height:100vh;
}

.login-page{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.login-box,.card,.panel{
background:#111827;
padding:25px;
border-radius:18px;
border:1px solid #1f2937;
}

.login-box{
width:100%;
max-width:420px;
}

input,textarea,select{
width:100%;
padding:12px;
margin-top:10px;
border:none;
outline:none;
border-radius:12px;
background:#020617;
color:#fff;
}

textarea{
height:100px;
resize:vertical;
}

button{
border:none;
padding:12px;
border-radius:12px;
cursor:pointer;
font-weight:800;
color:#fff;
margin-top:12px;
}

.blue{background:#2563eb}
.red{background:#ef4444}
.green{background:#10b981}
.gold{background:#d97706}

.error{
color:#ef4444;
margin-top:10px;
display:none;
text-align:center;
}

#dashboard{display:none}

.topbar{
padding:18px 28px;
background:#111827;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
}

.wrapper{
padding:25px;
max-width:1500px;
margin:auto;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
}

.panel{
margin-top:25px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
padding:10px;
border-bottom:1px solid #1f2937;
text-align:left;
font-size:14px;
vertical-align:top;
}

.status-on{color:#10b981;font-weight:bold}
.status-off{color:#ef4444;font-weight:bold}

.history-item{
padding:10px;
border-bottom:1px solid #1f2937;
cursor:pointer;
}

.history-item:hover{
background:#1e293b;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-page" id="loginPage">
<div class="login-box">

<h1 style="text-align:center">🔒 WMN3 PRO ACCESS</h1>

<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">

<button class="blue" style="width:100%" onclick="login()">Login</button>

<div class="error" id="error">Invalid Login</div>

</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">

<div class="topbar">
<div>
<h2>WMN3 DNS PRO</h2>
<div id="welcome"></div>
</div>

<button class="red" onclick="logout()">Logout</button>
</div>

<div class="wrapper">

<div class="grid">

<div class="card">
<h3>SPF Generator</h3>
<textarea id="spfDomains" placeholder="Domains"></textarea>
<textarea id="spfIps" placeholder="IPs"></textarea>
<button class="blue" onclick="generateSPF()">Generate</button>
</div>

<div class="card">
<h3>MX Generator</h3>
<textarea id="mxDomains" placeholder="Domains"></textarea>
<textarea id="mxIps" placeholder="IPs"></textarea>
<button class="blue" onclick="generateMX()">Generate</button>
</div>

<div class="card">
<h3>A Generator</h3>
<textarea id="aDomains" placeholder="Domains"></textarea>
<textarea id="aIps" placeholder="IPs"></textarea>
<button class="blue" onclick="generateA()">Generate</button>
</div>

</div>

<div class="panel">
<h3>Output</h3>
<textarea id="output" style="height:220px"></textarea>
<button class="green" onclick="copyOutput()">Copy</button>
</div>

<div class="panel">
<h3>My History</h3>
<div id="historyList"></div>
</div>

<!-- ADMIN PANEL -->
<div class="panel" id="adminPanel" style="display:none">

<h2 style="color:#fbbf24">👑 Admin Panel</h2>

<h3 style="margin-top:15px">Add User</h3>

<input type="text" id="newUser" placeholder="Username">
<input type="password" id="newPass" placeholder="Password">

<select id="newRole">
<option value="member">member</option>
<option value="admin">admin</option>
</select>

<button class="gold" onclick="addUser()">Add User</button>

<h3 style="margin-top:25px">Users List</h3>

<table>
<thead>
<tr>
<th>User</th>
<th>Role</th>
<th>Status</th>
<th>Last Seen</th>
<th>Delete</th>
</tr>
</thead>
<tbody id="usersTable"></tbody>
</table>

<h3 style="margin-top:35px">📜 Users History</h3>

<table>
<thead>
<tr>
<th>User</th>
<th>Date</th>
<th>Preview</th>
</tr>
</thead>
<tbody id="historyAdminTable"></tbody>
</table>

</div>

</div>
</div>

<script>
let USERS = JSON.parse(localStorage.getItem("usersDB")) || [
{user:"admin",pass:"123456",role:"admin",online:false,lastSeen:"-"},
{user:"user1",pass:"111111",role:"member",online:false,lastSeen:"-"},
{user:"user2",pass:"222222",role:"member",online:false,lastSeen:"-"}
];

let currentUser=null;

function saveUsers(){
localStorage.setItem("usersDB",JSON.stringify(USERS));
}

function login(){

let u=username.value.trim();
let p=password.value.trim();

let found=USERS.find(x=>x.user===u && x.pass===p);

if(found){

currentUser=found;
found.online=true;
found.lastSeen=new Date().toLocaleString();

saveUsers();

loginPage.style.display="none";
dashboard.style.display="block";

welcome.innerHTML="👤 "+found.user+" ("+found.role+")";

renderHistory();

if(found.role==="admin"){
adminPanel.style.display="block";
renderUsers();
}

}else{
error.style.display="block";
}

}

function logout(){

if(currentUser){

let f=USERS.find(x=>x.user===currentUser.user);

if(f){
f.online=false;
f.lastSeen=new Date().toLocaleString();
saveUsers();
}

}

location.reload();
}

function lines(id){
return document.getElementById(id).value
.split('\n')
.map(x=>x.trim())
.filter(x=>x);
}

function setOutput(text){
output.value=text.trim();
saveHistory(text.trim());
}

function saveHistory(result){

let key="history_"+currentUser.user;

let h=JSON.parse(localStorage.getItem(key)||"[]");

h.unshift({
date:new Date().toLocaleString(),
data:result
});

h=h.slice(0,30);

localStorage.setItem(key,JSON.stringify(h));

renderHistory();

if(currentUser.role==="admin"){
renderAdminHistory();
}
}

function renderHistory(){

let key="history_"+currentUser.user;

let h=JSON.parse(localStorage.getItem(key)||"[]");

historyList.innerHTML="";

h.forEach(item=>{

let div=document.createElement("div");
div.className="history-item";
div.innerHTML=item.date;

div.onclick=()=>{
output.value=item.data;
};

historyList.appendChild(div);

});
}

function generateSPF(){

let d=lines("spfDomains");
let i=lines("spfIps");

let txt=i.map(ip=>"ip4:"+ip).join(" ");

let out="";

d.forEach(domain=>{
out+=domain+","+domain+',TXT,"v=spf1 '+txt+' -all"\n';
});

setOutput(out);
}

function generateMX(){

let d=lines("mxDomains");
let i=lines("mxIps").join(";");

let out="";

d.forEach(domain=>{
out+=domain+","+domain+",TXT,MXrecords:"+i+"\n";
});

setOutput(out);
}

function generateA(){

let d=lines("aDomains");
let i=lines("aIps").join(";");

let out="";

d.forEach(domain=>{
out+=domain+","+domain+",TXT,Arecords:"+i+"\n";
});

setOutput(out);
}

function copyOutput(){
output.select();
document.execCommand("copy");
}

function addUser(){

let u=newUser.value.trim();
let p=newPass.value.trim();
let r=newRole.value;

if(!u || !p)return;

if(USERS.find(x=>x.user===u)){
alert("User exists");
return;
}

USERS.push({
user:u,
pass:p,
role:r,
online:false,
lastSeen:"-"
});

saveUsers();
renderUsers();

newUser.value="";
newPass.value="";
}

function deleteUser(name){

if(name==="admin") return;

USERS=USERS.filter(x=>x.user!==name);

saveUsers();
renderUsers();
}

function renderUsers(){

usersTable.innerHTML="";

USERS.forEach(u=>{

let tr=document.createElement("tr");

tr.innerHTML=`
<td>${u.user}</td>
<td>${u.role}</td>
<td class="${u.online?'status-on':'status-off'}">
${u.online?'Online':'Offline'}
</td>
<td>${u.lastSeen}</td>
<td><button class="red" onclick="deleteUser('${u.user}')">Delete</button></td>
`;

usersTable.appendChild(tr);

});

renderAdminHistory();
}

function renderAdminHistory(){

historyAdminTable.innerHTML="";

USERS.forEach(u=>{

let key="history_"+u.user;

let h=JSON.parse(localStorage.getItem(key)||"[]");

h.forEach(item=>{

let tr=document.createElement("tr");

let preview=item.data.substring(0,80).replace(/\n/g," ");

tr.innerHTML=`
<td>${u.user}</td>
<td>${item.date}</td>
<td>${preview}...</td>
`;

historyAdminTable.appendChild(tr);

});

});

}
</script>

</body>
</html>
