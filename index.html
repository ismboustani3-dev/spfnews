<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WMN3 DNS PRO</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

/* LOGIN BOX */
.login-box{
width:100%;
max-width:430px;
background:#ffffff;
padding:42px 34px;
border-radius:28px;
box-shadow:0 25px 70px rgba(0,0,0,.30);
text-align:center;
animation:fadeUp .7s ease;
}

.logo-icon{
width:74px;
height:74px;
margin:auto;
border-radius:22px;
background:linear-gradient(135deg,#2563eb,#10b981);
display:flex;
justify-content:center;
align-items:center;
font-size:34px;
color:#fff;
font-weight:900;
box-shadow:0 15px 30px rgba(37,99,235,.25);
}

.login-box h1{
margin-top:20px;
font-size:38px;
font-weight:900;
color:#2563eb;
}

.login-box p{
margin-top:10px;
color:#64748b;
font-size:18px;
line-height:1.5;
margin-bottom:26px;
}

label{
display:block;
text-align:left;
margin-top:14px;
margin-bottom:8px;
font-weight:800;
color:#111827;
font-size:14px;
}

input{
width:100%;
padding:16px;
border-radius:16px;
border:2px solid #e5e7eb;
font-size:16px;
background:#fff;
color:#111827;
outline:none;
transition:.2s;
}

input:focus{
border-color:#2563eb;
box-shadow:0 0 0 4px rgba(37,99,235,.10);
}

button{
width:100%;
padding:17px;
margin-top:24px;
border:none;
border-radius:16px;
font-size:24px;
font-weight:900;
cursor:pointer;
color:#fff;
background:linear-gradient(135deg,#3b82f6,#10b981);
box-shadow:0 12px 25px rgba(59,130,246,.22);
transition:.2s;
}

button:hover{
transform:translateY(-2px);
}

.error{
margin-top:14px;
color:#ef4444;
font-weight:700;
display:none;
}

.footer{
margin-top:28px;
font-size:14px;
color:#64748b;
}

.success-page{
display:none;
width:100%;
max-width:800px;
background:#111827;
color:#fff;
padding:40px;
border-radius:25px;
text-align:center;
box-shadow:0 25px 70px rgba(0,0,0,.35);
}

.success-page h2{
font-size:42px;
margin-bottom:12px;
color:#10b981;
}

.success-page p{
font-size:20px;
color:#cbd5e1;
}

.logout{
margin-top:25px;
max-width:250px;
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(35px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-box" id="loginBox">

<div class="logo-icon">W</div>

<h1>WMN3 DNS PRO</h1>

<p>Enter your credentials to access the dashboard</p>

<label>Username</label>
<input type="text" id="username" placeholder="Enter username">

<label>Password</label>
<input type="password" id="password" placeholder="Enter password">

<button onclick="login()">Sign In</button>

<div class="error" id="error">Invalid Username or Password</div>

<div class="footer">
© 2026 WMN3 DNS Professional Suite
</div>

</div>

<!-- DASHBOARD -->
<div class="success-page" id="dashboard">

<h2>✅ Welcome</h2>
<p id="welcomeText"></p>

<button class="logout" onclick="logout()">Logout</button>

</div>

<script>
const USERS = [
{user:"admin",pass:"123456"},
{user:"user1",pass:"111111"},
{user:"user2",pass:"222222"}
];

function login(){

let u=document.getElementById("username").value.trim();
let p=document.getElementById("password").value.trim();

let found=USERS.find(x=>x.user===u && x.pass===p);

if(found){

document.getElementById("loginBox").style.display="none";
document.getElementById("dashboard").style.display="block";

document.getElementById("welcomeText").innerHTML=
"Hello <b>"+found.user+"</b>, access granted.";

}else{
document.getElementById("error").style.display="block";
}

}

function logout(){
location.reload();
}

document.addEventListener("keydown",function(e){
if(e.key==="Enter"){
login();
}
});
</script>

</body>
</html>
