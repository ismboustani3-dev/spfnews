<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DNS Tools Pro Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#e5e7eb;
min-height:100vh;
color:#111827;
}

/* LOGIN */
.login-page{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
background:
linear-gradient(135deg,#dbeafe,#e0f2fe,#ecfccb);
}

.login-box{
width:100%;
max-width:460px;
background:#ffffff;
padding:42px 36px;
border-radius:30px;
box-shadow:0 30px 70px rgba(0,0,0,.12);
text-align:center;
animation:fadeUp .7s ease;
}

.logo{
width:82px;
height:82px;
margin:auto;
border-radius:24px;
background:linear-gradient(135deg,#2563eb,#22c55e);
display:flex;
align-items:center;
justify-content:center;
font-size:38px;
color:#fff;
margin-bottom:18px;
box-shadow:0 15px 30px rgba(37,99,235,.20);
}

.login-box h1{
font-size:46px;
font-weight:900;
color:#2563eb;
margin-bottom:10px;
}

.login-box p{
font-size:18px;
color:#6b7280;
line-height:1.6;
margin-bottom:30px;
}

.field{
text-align:left;
margin-bottom:18px;
}

.field label{
display:block;
font-weight:800;
margin-bottom:8px;
font-size:14px;
color:#111827;
}

.field input{
width:100%;
padding:16px;
border-radius:16px;
border:2px solid #e5e7eb;
outline:none;
font-size:17px;
background:#fff;
transition:.2s;
}

.field input:focus{
border-color:#2563eb;
box-shadow:0 0 0 5px rgba(37,99,235,.08);
}

.login-btn{
width:100%;
padding:17px;
border:none;
border-radius:16px;
font-size:26px;
font-weight:900;
color:#fff;
cursor:pointer;
background:linear-gradient(90deg,#3b82f6,#22c55e);
margin-top:10px;
box-shadow:0 12px 25px rgba(59,130,246,.20);
}

.error{
display:none;
margin-top:14px;
font-weight:800;
color:#ef4444;
}

.footer-login{
margin-top:28px;
font-size:14px;
color:#6b7280;
}

/* DASHBOARD */
#dashboard{
display:none;
padding:40px;
text-align:center;
}

.card{
background:#fff;
max-width:700px;
margin:auto;
padding:40px;
border-radius:24px;
box-shadow:0 20px 50px rgba(0,0,0,.10);
}

.card h2{
font-size:42px;
color:#2563eb;
margin-bottom:14px;
}

.card p{
font-size:20px;
color:#4b5563;
margin-bottom:25px;
}

.logout{
padding:16px 28px;
border:none;
border-radius:16px;
font-size:20px;
font-weight:800;
color:#fff;
background:#ef4444;
cursor:pointer;
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(25px);}
to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-page" id="loginPage">
<div class="login-box">

<div class="logo">🚀</div>

<h1>DNS Tools Pro</h1>

<p>Secure access to your professional dashboard</p>

<div class="field">
<label>Username</label>
<input type="text" id="username" placeholder="Enter username">
</div>

<div class="field">
<label>Password</label>
<input type="password" id="password" placeholder="Enter password">
</div>

<button class="login-btn" onclick="login()">Sign In</button>

<div class="error" id="error">Invalid Username or Password</div>

<div class="footer-login">
Powered by WMN3 Security Suite
</div>

</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
<div class="card">

<h2>✅ Access Granted</h2>

<p id="welcomeText"></p>

<button class="logout" onclick="logout()">Logout</button>

</div>
</div>

<script>
const USERS = [
{user:"admin",pass:"123456"},
{user:"user1",pass:"111111"},
{user:"user2",pass:"222222"}
];

function login(){

let u=document.getElementById("username").value.trim();
let p=document.getElementById("password").value.trim();

let found=USERS.find(x=>x.user===u && x.pass===p);

if(found){

document.getElementById("loginPage").style.display="none";
document.getElementById("dashboard").style.display="block";

document.getElementById("welcomeText").innerHTML =
"Welcome <b>"+found.user+"</b> to DNS Tools Pro.";

}else{
document.getElementById("error").style.display="block";
}

}

function logout(){
location.reload();
}

document.addEventListener("keydown",function(e){
if(e.key==="Enter"){
login();
}
});
</script>

</body>
</html>
